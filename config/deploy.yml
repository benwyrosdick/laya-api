service: laya-api
image: benwyrosdick/laya-api

servers:
  web:
    hosts:
      - house.wyrosdick.com
    options:
      add-host: host.docker.internal:host-gateway

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "root") %>
  port: 2222

proxy:
  ssl: true
  host: laya-api.benwyrosdick.com
  app_port: 8000
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

volumes:
  - /var/lib/laya-api/huggingface:/data/huggingface

env:
  clear:
    APP_ENV: production
    PUBLIC_BASE_URL: https://laya-api.benwyrosdick.com
    ALLOW_DEV_LOGIN: "false"
    ENGINE: laya
    LAYA_PRELOAD: "true"
    LAYA_DEVICE: cpu
    RATE_LIMIT_RPM: "180"
    HF_HOME: /data/huggingface
  secret:
    - SECRET_KEY
    - DATABASE_URL
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET

deploy_timeout: 600

aliases:
  console: app exec --interactive --reuse "bash"
  logs: app logs
