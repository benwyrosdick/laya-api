[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-api"
version = "0.1.6"
description = "Hosted System One API for Laya: Google login, API keys, typed decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Laya API" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "authlib>=1.4",
    "httpx>=0.27",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
engine = ["laya>=0.3.4"]
lev = ["lev @ git+https://github.com/franckverrot/lev.git"]
kev = ["kev @ git+https://github.com/jaredpalmer/kev.git"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
laya-api = "laya_api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laya_api = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
